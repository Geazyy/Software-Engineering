
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Application Form</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">
    <h1>Job Application</h1>
    <p>Fill out the form below to apply for a position.</p>

    <form>

      <label for="name">Full Name</label>
      <input
        type="text"
        id="name"
        name="name"
        placeholder="Enter your full name"
        required
      >

      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email"
        required
      >

      <label for="position">Select Position</label>
      <select id="position" name="position" required>
        <option value="">Choose a position</option>
        <option value="frontend">Frontend Developer</option>
        <option value="backend">Backend Developer</option>
        <option value="fullstack">Full Stack Developer</option>
        <option value="designer">UI/UX Designer</option>
      </select>

      <fieldset class="radio-group">
        <legend>Availability</legend>

        <input type="radio" id="full-time" name="availability" value="full-time" required>
        <label for="full-time">Full-Time</label>

        <input type="radio" id="part-time" name="availability" value="part-time">
        <label for="part-time">Part-Time</label>

        <input type="radio" id="freelance" name="availability" value="freelance">
        <label for="freelance">Freelance</label>
      </fieldset>

      <label for="message">Why should we hire you?</label>
      <textarea
        id="message"
        name="message"
        rows="5"
        placeholder="Tell us about your skills and experience..."
        required
      ></textarea>

      <button type="submit">Submit Application</button>

    </form>
  </div>

</body>
</html>
