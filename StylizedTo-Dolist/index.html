<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do List</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <ul class="todo-list">

    <li>
      <input type="checkbox" id="html-task">
      <label for="html-task">Learn HTML</label>

      <ul class="sub-item">
        <li>
          <a
            class="sub-item-link"
            href="https://www.freecodecamp.org/learn/"
            target="_blank"
          >
            Practice HTML
          </a>
        </li>
      </ul>
    </li>

    <li>
      <input type="checkbox" id="css-task">
      <label for="css-task">Learn CSS</label>

      <ul class="sub-item">
        <li>
          <a
            class="sub-item-link"
            href="https://developer.mozilla.org/en-US/docs/Web/CSS"
            target="_blank"
          >
            Study CSS
          </a>
        </li>
      </ul>
    </li>

    <li>
      <input type="checkbox" id="javascript-task">
      <label for="javascript-task">Learn JavaScript</label>

      <ul class="sub-item">
        <li>
          <a
            class="sub-item-link"
            href="https://developer.mozilla.org/en-US/docs/Web/JavaScript"
            target="_blank"
          >
            Practice JavaScript
          </a>
        </li>
      </ul>
    </li>

    <li>
      <input type="checkbox" id="github-task">
      <label for="github-task">Practice GitHub</label>

      <ul class="sub-item">
        <li>
          <a
            class="sub-item-link"
            href="https://docs.github.com/"
            target="_blank"
          >
            Learn GitHub
          </a>
        </li>
      </ul>
    </li>

  </ul>

</body>
</html>
